/* FLIP — generated from tokens.json */
:root, [data-theme="display"] {
  --bg: #050505;
  --bg-raised: #0b0b0b;
  --bg-invert: #f2f2f2;
  --ink: #f2f2f2;
  --ink-1: #c8c8c8;
  --ink-2: #929292;
  --ink-3: #7a7a7a;
  --rule: #292929;
  --rule-strong: #5e5e5e;
  --meter-off: #333333;
  --matrix-ghost: #0f0f0f;
  --amber: #d9a441;
  --amber-dim: #6b5226;
  --desk: #1c1c1e;
  --taskbar: #202020;
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-14: 56px;
  --space-18: 72px;
  --radius-0: 0px;
  --radius-1: 2px;
  --radius-win: 8px;
  --matrix-pitch-xl: 28px;
  --matrix-pitch-l: 12px;
  --matrix-pitch-m: 8px;
  --matrix-dot: 72%;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
}
.t-date { font-family: var(--font-mono); font-size: 30px; line-height: 36px; font-weight: 500; letter-spacing: 0.06em; }
.t-board { font-family: var(--font-mono); font-size: 26px; line-height: 36px; font-weight: 500; letter-spacing: 0.03em; }
.t-board-head { font-family: var(--font-mono); font-size: 26px; line-height: 36px; font-weight: 400; letter-spacing: 0.03em; }
.t-metric { font-family: var(--font-mono); font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.04em; }
.t-countdown { font-family: var(--font-mono); font-size: 34px; line-height: 40px; font-weight: 500; letter-spacing: 0.04em; }
.t-section { font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 500; letter-spacing: 0.14em; }
.t-status { font-family: var(--font-mono); font-size: 13px; line-height: 20px; font-weight: 500; letter-spacing: 0.1em; }
.t-control { font-family: var(--font-mono); font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: 0.06em; }
.t-micro { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.08em; }

/* FLIP components. Needs tokens.css. Every size is a 1080p design pixel multiplied by --u (see README: Scaling). */
.fl-display{--u:1;background:var(--bg);color:var(--ink);font-family:var(--font-mono);text-transform:uppercase;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0;-webkit-font-smoothing:antialiased;letter-spacing:.03em;line-height:1.3}
.fl-display *,.fl-display *::before,.fl-display *::after{box-sizing:border-box}
.fl-display :where(button){font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.fl-display :focus-visible{outline:1px dotted var(--ink);outline-offset:calc(var(--u, 1) * 3px)}
.fl-ink1{color:var(--ink-1)}.fl-ink2{color:var(--ink-2)}.fl-ink3{color:var(--ink-3)}.fl-warn{color:var(--amber)}
.fl-hit{cursor:pointer;border-radius:var(--radius-0)}
.fl-hit:hover{background:rgba(242,242,242,.035)}

/* Dot matrix */
.fl-matrix{display:block;overflow:visible}
.fl-matrix circle,.fl-matrix rect{fill:var(--matrix-ghost);transition:fill .26s cubic-bezier(.2,.7,.2,1)}
.fl-matrix.no-ghost circle,.fl-matrix.no-ghost rect{fill:transparent}
.fl-matrix .on,.fl-matrix.no-ghost .on{fill:var(--ink)}
.fl-matrix.is-instant *{transition:none!important}
.fl-matrix--warn .on{fill:var(--amber)}

/* Dotted meter */
.fl-meter{display:flex;justify-content:space-between;align-items:center;height:calc(var(--u, 1) * 6px);width:100%}
.fl-meter i{display:block;flex:none;width:calc(var(--u, 1) * 4px);height:calc(var(--u, 1) * 4px);border-radius:50%;background:var(--meter-off)}
.fl-meter i.on{background:var(--ink)}
.fl-meter.is-warn i{background:var(--amber-dim)}
.fl-meter.is-warn i.on{background:var(--amber)}
.fl-meter--sq i{border-radius:0;width:calc(var(--u, 1) * 10px);height:calc(var(--u, 1) * 6px)}
.fl-meter.is-loading i{animation:fl-scan 1.32s linear infinite}
@keyframes fl-scan{0%,100%{background:var(--meter-off)}6%{background:var(--ink)}18%{background:var(--meter-off)}}

/* Dot plot */
.fl-plot{display:block;width:100%}
.fl-plot rect{fill:var(--meter-off)}
.fl-plot rect.on{fill:var(--ink-2)}

/* Status bar */
.fl-status{display:flex;justify-content:space-between;align-items:center;min-height:calc(var(--u, 1) * 36px);font-size:calc(var(--u, 1) * 13px);letter-spacing:.1em;font-weight:500;color:var(--ink-3);gap:calc(var(--u, 1) * 24px)}
.fl-status__l,.fl-status__r{display:flex;align-items:center;gap:calc(var(--u, 1) * 22px);white-space:nowrap}
.fl-word{color:var(--ink-2);letter-spacing:.32em}
.fl-ind{display:inline-flex;align-items:center;gap:calc(var(--u, 1) * 7px)}
.fl-led{display:inline-block;width:calc(var(--u, 1) * 6px);height:calc(var(--u, 1) * 6px);border-radius:50%;background:var(--ink-2)}
.fl-led.is-off{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-3)}
.fl-led.is-warn{background:var(--amber)}
.fl-led.is-pulse{animation:fl-pulse 1.6s ease-in-out infinite}
@keyframes fl-pulse{50%{opacity:.25}}
.fl-ctl{all:unset;cursor:pointer;padding:calc(var(--u, 1) * 4px) calc(var(--u, 1) * 8px);color:var(--ink-3);font-size:calc(var(--u, 1) * 13px);letter-spacing:.1em;font-weight:500;line-height:1}
.fl-ctl:hover{color:var(--ink)}
.fl-ctl.is-on{color:var(--ink-1)}
.fl-ctl:focus-visible{outline:1px dotted var(--ink);outline-offset:2px}

/* AI usage rows */
.fl-usage{display:grid;column-gap:calc(var(--u, 1) * 40px);row-gap:calc(var(--u, 1) * 26px);justify-content:end;align-items:start;font-size:calc(var(--u, 1) * 26px);font-weight:500;line-height:calc(var(--u, 1) * 34px)}
.fl-usage__row{display:contents}
.fl-usage__name{text-align:right;padding:0 calc(var(--u, 1) * 4px)}
.fl-usage__slot{display:flex;flex-direction:column;gap:calc(var(--u, 1) * 7px);min-width:calc(var(--u, 1) * 150px);white-space:nowrap}
.fl-usage__val{display:flex;justify-content:flex-end;gap:calc(var(--u, 1) * 16px)}
.fl-usage__span{grid-column:2 / -1;text-align:right;white-space:nowrap}
.fl-usage .is-dim{color:var(--ink-3)}
.fl-usage__meta{font-size:calc(var(--u, 1) * 12px);letter-spacing:.08em;color:var(--ink-3);text-align:right;font-weight:400;line-height:1}

/* Airport board (world clock) */
.fl-board{display:flex;flex-direction:column;font-size:calc(var(--u, 1) * 26px);font-weight:500;line-height:calc(var(--u, 1) * 36px)}
.fl-board__r{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u, 1) * 100px) calc(var(--u, 1) * 118px) calc(var(--u, 1) * 96px);column-gap:calc(var(--u, 1) * 36px);padding:calc(var(--u, 1) * 2px) calc(var(--u, 1) * 4px)}
.fl-board__r>span{white-space:nowrap;overflow:hidden}
.fl-board__r .r{text-align:right}

/* Left panel: sections + metric rows */
.fl-sec{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u, 1) * 16px);font-size:calc(var(--u, 1) * 13px);letter-spacing:.14em;font-weight:500;color:var(--ink-3);padding-bottom:calc(var(--u, 1) * 10px);border-bottom:1px solid var(--rule);white-space:nowrap}
.fl-mrow{display:grid;grid-template-columns:calc(var(--u, 1) * 86px) minmax(0,1fr) calc(var(--u, 1) * 176px) calc(var(--u, 1) * 84px);align-items:center;column-gap:calc(var(--u, 1) * 20px);min-height:calc(var(--u, 1) * 42px);font-size:calc(var(--u, 1) * 16px);letter-spacing:.04em;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.fl-mrow b{font-weight:500;color:var(--ink-1)}
.fl-mrow .r{text-align:right;white-space:nowrap}
.fl-mrow--plot{grid-template-columns:calc(var(--u, 1) * 86px) minmax(0,1fr);padding:calc(var(--u, 1) * 10px) 0}

/* Segmented control (settings) */
.fl-seg{display:inline-flex;border:1px solid var(--rule-strong);font-size:calc(var(--u, 1) * 15px);font-weight:500;letter-spacing:.06em}
.fl-seg button{all:unset;cursor:pointer;white-space:nowrap;padding:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 14px);color:var(--ink-2);line-height:1.2}
.fl-seg button+button{border-left:1px solid var(--rule-strong)}
.fl-seg button:hover{color:var(--ink)}
.fl-seg button.is-on{background:var(--bg-invert);color:var(--bg)}
.fl-seg button:focus-visible{outline:1px dotted var(--ink);outline-offset:2px}
.fl-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:calc(var(--u, 1) * 10px);border:1px solid var(--rule-strong);padding:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 14px);font-size:calc(var(--u, 1) * 15px);font-weight:500;letter-spacing:.06em;color:var(--ink-1)}
.fl-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.fl-btn kbd,.fl-kbd{font:inherit;font-size:.8em;color:var(--ink-3);border:1px solid var(--rule);padding:0 calc(var(--u, 1) * 5px)}
.fl-btn--primary{background:var(--bg-invert);color:var(--bg);border-color:var(--bg-invert)}
.fl-btn--primary kbd{color:var(--bg);border-color:rgba(5,5,5,.35)}

/* Overlay sheet */
.fl-sheet{background:var(--bg-raised);border:1px solid var(--rule-strong);display:flex;flex-direction:column;min-height:0}
.fl-sheet__h{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u, 1) * 18px) calc(var(--u, 1) * 28px);border-bottom:1px solid var(--rule);font-size:calc(var(--u, 1) * 15px);letter-spacing:.14em;font-weight:500}
.fl-tabs{display:flex;gap:calc(var(--u, 1) * 4px);padding:0 calc(var(--u, 1) * 20px);border-bottom:1px solid var(--rule)}
.fl-tabs button{all:unset;cursor:pointer;padding:calc(var(--u, 1) * 14px) calc(var(--u, 1) * 10px);font-size:calc(var(--u, 1) * 14px);letter-spacing:.12em;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.fl-tabs button:hover{color:var(--ink-1)}
.fl-tabs button.is-on{color:var(--ink);border-bottom-color:var(--ink)}
.fl-srow{display:grid;grid-template-columns:calc(var(--u, 1) * 220px) max-content minmax(0,1fr);align-items:center;column-gap:calc(var(--u, 1) * 24px);padding:calc(var(--u, 1) * 13px) calc(var(--u, 1) * 28px);border-bottom:1px solid var(--rule);font-size:calc(var(--u, 1) * 15px);letter-spacing:.06em}
.fl-srow__l{color:var(--ink-2)}
.fl-srow__hint{text-align:right;font-size:calc(var(--u, 1) * 12px);letter-spacing:.08em;color:var(--ink-3);text-transform:none}

/* Menu (tray) */
.fl-menu{background:var(--bg-raised);border:1px solid var(--rule-strong);border-radius:var(--radius-1);padding:calc(var(--u, 1) * 6px) 0;font-size:calc(var(--u, 1) * 14px);letter-spacing:.06em;font-weight:500;min-width:calc(var(--u, 1) * 320px)}
.fl-menu__i{display:grid;grid-template-columns:calc(var(--u, 1) * 22px) 1fr auto;align-items:center;padding:calc(var(--u, 1) * 8px) calc(var(--u, 1) * 14px);color:var(--ink-1);cursor:pointer}
.fl-menu__i:hover{background:var(--bg-invert);color:var(--bg)}
.fl-menu__i:hover .fl-ink3{color:#3a3a3a}
.fl-menu__sep{height:1px;background:var(--rule);margin:calc(var(--u, 1) * 6px) 0}
.fl-menu__head{padding:calc(var(--u, 1) * 8px) calc(var(--u, 1) * 14px) calc(var(--u, 1) * 10px);color:var(--ink-3);font-size:calc(var(--u, 1) * 12px);letter-spacing:.12em}

/* Window frame */
.fl-win{position:absolute;background:var(--bg);border:1px solid var(--rule-strong);border-radius:var(--radius-win);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 calc(var(--u, 1) * 24px) calc(var(--u, 1) * 64px) rgba(0,0,0,.55)}
.fl-titlebar{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u, 1) * 32px);flex:none;padding-left:calc(var(--u, 1) * 14px);font-size:calc(var(--u, 1) * 12px);letter-spacing:.14em;font-weight:500;color:var(--ink-3);border-bottom:1px solid var(--rule);user-select:none}
.fl-titlebar__c{display:flex;height:100%}
.fl-titlebar__c button{all:unset;cursor:pointer;width:calc(var(--u, 1) * 46px);display:grid;place-items:center;color:var(--ink-2);font-size:calc(var(--u, 1) * 13px)}
.fl-titlebar__c button:hover{background:#1a1a1a;color:var(--ink)}
.fl-titlebar__c button.x:hover{background:#c42b1c;color:#fff}

/* FLIP app layout + prototype scenes */
html,body{margin:0;height:100%;background:#000;color:#f2f2f2;font-family:var(--font-mono);overflow:hidden}
.fl-host{position:relative;overflow:hidden;container-type:size}

/* ---------- Dashboard: FULL ---------- */
.fl-dash{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"status status" "left right";column-gap:calc(var(--u, 1) * 80px);padding:calc(var(--u, 1) * 20px) calc(var(--u, 1) * 72px) calc(var(--u, 1) * 60px)}
.fl-dash>.fl-status{grid-area:status;margin-bottom:calc(var(--u, 1) * 30px)}
.fl-left{grid-area:left;display:flex;flex-direction:column;gap:calc(var(--u, 1) * 38px);min-height:0;overflow:hidden;padding-top:calc(var(--u, 1) * 18px)}
.fl-right{grid-area:right;display:flex;flex-direction:column;align-items:flex-end;min-height:0;min-width:0}
.fl-clockwrap{display:flex;align-items:flex-end;gap:calc(var(--u, 1) * 20px);cursor:pointer;padding:calc(var(--u, 1) * 6px)}
.fl-clockwrap:hover .fl-matrix .on{fill:#fff}
.fl-ampm{font-size:calc(var(--u, 1) * 22px);color:var(--ink-2);padding-bottom:calc(var(--u, 1) * 4px);line-height:1}
.fl-side{display:flex;flex-direction:column;align-items:flex-end}
.fl-date{font-size:calc(var(--u, 1) * 30px);line-height:calc(var(--u, 1) * 36px);font-weight:500;letter-spacing:.06em;margin-top:calc(var(--u, 1) * 22px);display:flex;gap:calc(var(--u, 1) * 24px);align-items:baseline;padding-right:calc(var(--u, 1) * 6px)}
.fl-date small{font-size:calc(var(--u, 1) * 14px);letter-spacing:.12em;color:var(--ink-3)}
.fl-focusline{display:none;margin-top:calc(var(--u, 1) * 10px);font-size:calc(var(--u, 1) * 16px);letter-spacing:.1em;color:var(--ink-2);padding-right:calc(var(--u, 1) * 6px);gap:calc(var(--u, 1) * 14px);align-items:center}
.is-running .fl-focusline,.is-paused .fl-focusline{display:flex}
.fl-focusline .fl-meter{width:calc(var(--u, 1) * 150px)}
.fl-side .fl-usage{margin-top:calc(var(--u, 1) * 54px)}
.fl-board{margin-top:calc(var(--u, 1) * 84px);width:min(100%,calc(var(--u, 1) * 820px))}
.fl-keys{margin-top:auto;font-size:calc(var(--u, 1) * 12px);letter-spacing:.1em;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 20px)}
.fl-keys kbd{font:inherit;color:var(--ink-2)}
.fl-cstrip{display:none}

/* left panel blocks */
.fl-blk{display:flex;flex-direction:column}
.fl-blk--focus{cursor:pointer}
.fl-blk--focus:hover .fl-sec{color:var(--ink-2)}
.fl-focus{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"main side" "bar bar" "hint hint";column-gap:calc(var(--u, 1) * 28px);row-gap:calc(var(--u, 1) * 14px);padding-top:calc(var(--u, 1) * 16px)}
.fl-focus__main{grid-area:main;display:flex;flex-direction:column;gap:calc(var(--u, 1) * 4px)}
.fl-focus__phase{font-size:calc(var(--u, 1) * 13px);letter-spacing:.14em;color:var(--ink-2)}
.fl-focus__time{font-size:calc(var(--u, 1) * 34px);line-height:calc(var(--u, 1) * 40px);font-weight:500;color:var(--ink-1)}
.fl-focus__side{grid-area:side;align-self:end;text-align:right;font-size:calc(var(--u, 1) * 14px);letter-spacing:.1em;color:var(--ink-2);line-height:calc(var(--u, 1) * 22px)}
.fl-focus__dots{letter-spacing:.3em;color:var(--ink-1);font-size:calc(var(--u, 1) * 18px)}
.fl-focus .fl-meter{grid-area:bar}
.fl-focus__hint{grid-area:hint;font-size:calc(var(--u, 1) * 12px);letter-spacing:.1em;color:var(--ink-3)}
.fl-focus [data-clock="pomo"]{display:none;padding:calc(var(--u, 1) * 6px) 0 calc(var(--u, 1) * 2px)}
.is-running .fl-focus [data-clock="pomo"],.is-paused .fl-focus [data-clock="pomo"]{display:block}
.is-running .fl-focus__time,.is-paused .fl-focus__time{display:none}
.is-paused [data-clock="pomo"] .fl-matrix{opacity:.45}
/* Pomodoro active: focus block leads, system block condenses */
.is-running .fl-blk--focus,.is-paused .fl-blk--focus{order:-1}
.is-running .fl-blk--sys .fl-opt,.is-paused .fl-blk--sys .fl-opt{display:none}
.is-running .fl-blk--focus .fl-sec{color:var(--ink-1)}

/* ---------- COMPACT ---------- */
.fl-dash[data-layout="compact"]{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"status status" "clock side" "board board" "strip strip";column-gap:calc(var(--u, 1) * 48px);padding:calc(var(--u, 1) * 14px) calc(var(--u, 1) * 44px) calc(var(--u, 1) * 30px)}
.fl-dash[data-layout="compact"]>.fl-status{margin-bottom:calc(var(--u, 1) * 18px)}
[data-layout="compact"] .fl-left{display:none}
[data-layout="compact"] .fl-right{display:contents}
[data-layout="compact"] .fl-clockwrap{grid-area:clock;align-self:start}
[data-layout="compact"] .fl-side{grid-area:side}
[data-layout="compact"] .fl-date{margin-top:0}
[data-layout="compact"] .fl-side .fl-usage{margin-top:calc(var(--u, 1) * 22px);row-gap:calc(var(--u, 1) * 14px)}
[data-layout="compact"] .fl-board{grid-area:board;width:100%;flex-direction:row;justify-content:space-between;align-self:center;margin-top:calc(var(--u, 1) * 18px);border-top:1px solid var(--rule);padding-top:calc(var(--u, 1) * 20px)}
[data-layout="compact"] .fl-board__r.fl-board__h{display:none}
[data-layout="compact"] .fl-board__r{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:0}
[data-layout="compact"] .fl-board__r>span:first-child{font-size:calc(var(--u, 1) * 13px);letter-spacing:.14em;color:var(--ink-3);order:3}

[data-layout="compact"] .fl-board__r .r{text-align:left}
[data-layout="compact"] .fl-cstrip{grid-area:strip;display:flex;flex-wrap:wrap;gap:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 28px);font-size:calc(var(--u, 1) * 15px);letter-spacing:.06em;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:calc(var(--u, 1) * 14px)}
.fl-cstrip b{font-weight:500;color:var(--ink-1)}
.fl-cstrip .fl-hit{padding:0 calc(var(--u, 1) * 4px)}
[data-layout="compact"] .fl-focusline{display:none!important}

/* ---------- MINI ---------- */
.fl-dash[data-layout="mini"]{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"clock date" "usage usage";column-gap:calc(var(--u, 1) * 28px);row-gap:calc(var(--u, 1) * 18px);padding:calc(var(--u, 1) * 24px) calc(var(--u, 1) * 28px);align-items:end}
[data-layout="mini"]>.fl-status{position:absolute;top:0;right:0;left:0;padding:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 12px);opacity:0;transition:opacity .2s;background:var(--bg);z-index:2}
[data-layout="mini"]:hover>.fl-status{opacity:1}

[data-layout="mini"] .fl-left,[data-layout="mini"] .fl-board,[data-layout="mini"] .fl-focusline{display:none!important}
[data-layout="mini"] .fl-right{display:contents}
[data-layout="mini"] .fl-clockwrap{grid-area:clock}
[data-layout="mini"] .fl-side{display:contents}
[data-layout="mini"] .fl-date{grid-area:date;justify-content:flex-end;font-size:calc(var(--u, 1) * 26px)}
[data-layout="mini"] .fl-usage{grid-area:usage;align-self:start}
[data-layout="mini"] .fl-date{margin-top:0}
[data-layout="mini"] .fl-date small{display:none}
[data-layout="mini"] .fl-side .fl-usage{margin-top:0;row-gap:calc(var(--u, 1) * 12px);justify-content:space-between;width:100%}

/* module visibility */
.no-date .fl-date{display:none}.no-ai .fl-usage{display:none}.no-world .fl-board{display:none!important}

/* ---------- overlays ---------- */
.fl-scrim{position:absolute;inset:0;background:rgba(5,5,5,.84);z-index:10;display:grid;place-items:center}
.fl-scrim--clear{background:transparent;place-items:end start}
.fl-ov{position:relative;width:min(calc(var(--u, 1) * 1320px),92%);height:min(calc(var(--u, 1) * 860px),90%)}
.fl-ov--ai{width:min(calc(var(--u, 1) * 1180px),92%);height:min(calc(var(--u, 1) * 720px),90%)}
.fl-ov--sys{width:min(calc(var(--u, 1) * 1440px),94%);height:min(calc(var(--u, 1) * 860px),92%)}
.fl-sheet{height:100%}
.fl-sheet__b{flex:1;overflow:auto;min-height:0}
.fl-sheet__f{display:flex;gap:calc(var(--u, 1) * 12px);align-items:center;padding:calc(var(--u, 1) * 16px) calc(var(--u, 1) * 28px);border-top:1px solid var(--rule)}
.fl-sheet__f .grow{flex:1}
.fl-sheet__b::-webkit-scrollbar{width:calc(var(--u, 1) * 8px)}.fl-sheet__b::-webkit-scrollbar-thumb{background:var(--rule-strong)}
.fl-srow__c{display:flex;flex-wrap:wrap;gap:calc(var(--u, 1) * 10px);align-items:center;min-width:0}
.fl-srow--head{padding-top:calc(var(--u, 1) * 22px);padding-bottom:calc(var(--u, 1) * 8px);color:var(--ink-3);font-size:calc(var(--u, 1) * 12px);letter-spacing:.14em;border-bottom:1px solid var(--rule)}
.fl-loc{display:grid;grid-template-columns:calc(var(--u, 1) * 30px) minmax(0,1fr) calc(var(--u, 1) * 80px) minmax(0,1fr) calc(var(--u, 1) * 90px) auto;align-items:center;gap:calc(var(--u, 1) * 18px);padding:calc(var(--u, 1) * 10px) calc(var(--u, 1) * 28px);border-bottom:1px solid var(--rule);font-size:calc(var(--u, 1) * 15px);letter-spacing:.06em}
.fl-loc .grip{color:var(--ink-3);letter-spacing:-.1em}
.fl-iconbtn{all:unset;cursor:pointer;color:var(--ink-3);padding:calc(var(--u, 1) * 2px) calc(var(--u, 1) * 8px);font-size:calc(var(--u, 1) * 15px)}
.fl-iconbtn:hover{color:var(--ink)}
.fl-select{all:unset;cursor:pointer;border:1px solid var(--rule-strong);padding:calc(var(--u, 1) * 6px) calc(var(--u, 1) * 14px);font-size:calc(var(--u, 1) * 15px);letter-spacing:.06em;color:var(--ink-1);background:var(--bg)}
.fl-select option{background:#0b0b0b;color:#f2f2f2}
.fl-preview{padding:calc(var(--u, 1) * 10px) 0}

.fl-two>div+div{border-left:1px solid var(--rule)}
.fl-detail{padding:calc(var(--u, 1) * 24px) calc(var(--u, 1) * 28px);display:flex;flex-direction:column;gap:calc(var(--u, 1) * 14px);border-bottom:1px solid var(--rule)}
.fl-detail__big{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u, 1) * 24px)}
.fl-kv{display:grid;grid-template-columns:calc(var(--u, 1) * 200px) 1fr;padding:calc(var(--u, 1) * 11px) calc(var(--u, 1) * 28px);border-bottom:1px solid var(--rule);font-size:calc(var(--u, 1) * 15px);letter-spacing:.06em}

.fl-core{display:grid;grid-template-columns:calc(var(--u, 1) * 80px) 1fr calc(var(--u, 1) * 56px);white-space:nowrap;gap:calc(var(--u, 1) * 14px);align-items:center;font-size:calc(var(--u, 1) * 13px);color:var(--ink-2)}

.fl-timer{position:absolute;left:calc(var(--u, 1) * 72px);bottom:calc(var(--u, 1) * 60px);width:calc(var(--u, 1) * 640px);z-index:11}
.fl-timer .fl-sheet__b{padding:calc(var(--u, 1) * 22px) calc(var(--u, 1) * 28px);display:flex;flex-direction:column;gap:calc(var(--u, 1) * 18px)}
.fl-timer__row{display:flex;flex-wrap:wrap;gap:calc(var(--u, 1) * 10px)}

/* ---------- prototype chrome ---------- */
.proto-bar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:4px;padding:0 12px;background:#000;border-bottom:1px solid #1d1d1d;font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:100;overflow-x:auto;white-space:nowrap}
.proto-bar b{color:#929292;font-weight:500;margin-right:10px;letter-spacing:.3em}
.proto-bar button{all:unset;cursor:pointer;padding:6px 9px;color:#7a7a7a}
.proto-bar button:hover{color:#f2f2f2}
.proto-bar button.is-on{color:#050505;background:#f2f2f2}
.proto-bar .sp{flex:1}
.proto-view{position:fixed;top:44px;left:0;right:0;bottom:0;display:grid;place-items:center;overflow:hidden}
.proto-stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center;flex:none;background:#050505;overflow:hidden}
body.shot .proto-bar{display:none}
body.shot .proto-view{top:0}

/* scenes */
.sc-full{position:absolute;inset:0}
.sc-desk{position:absolute;inset:0;background:var(--desk);background-image:radial-gradient(#26262a 1px,transparent 1px);background-size:24px 24px;font-family:var(--font-mono)}
.sc-taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--taskbar);border-top:1px solid #2c2c2c;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;gap:18px;font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;color:#e6e6e6}
.sc-taskbar .apps{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.sc-taskbar .apps i{display:block;width:40px;height:40px;border-radius:4px;background:#2b2b2b}
.sc-taskbar .apps i.flip{background:#050505;border:1px solid #3a3a3a;display:grid;place-items:center}
.sc-taskbar .apps i.flip::after{content:"";width:3px;height:3px;border-radius:50%;background:#f2f2f2;box-shadow:0 -6px #f2f2f2,0 6px #f2f2f2,6px -6px #f2f2f2,6px 0 #f2f2f2}
.sc-taskbar .apps i.on{box-shadow:inset 0 -3px 0 -1px #929292}
.sc-tray{display:flex;align-items:center;gap:14px}
.sc-tray .ti{width:28px;height:28px;display:grid;place-items:center;border-radius:4px}

.sc-time{text-align:right;line-height:1.35}

    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  window.addEventListener('DOMContentLoaded', function () {
    stage = document.querySelector('.proto-stage'); bar = document.querySelector('.proto-bar');
    if (FROZEN_AT && !Q.get('tz')) S.cfg.homeTz = 'Asia/Singapore';
    var start = +(Q.get('screen') || (location.hash || '#1').slice(1)) - 1;
    go(isNaN(start) || start < 0 || start >= SCREENS.length ? 0 : start);
    fitStage(); window.addEventListener('resize', fitStage);
    tick();
  });
  window.FLIP_PROTO = { S: S, go: go, SCREENS: SCREENS };
})();

</script>
