[package]
name = "flip"
version = "0.2.0"
description = "FLIP: an airport-board clock and productivity dashboard for Windows"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "flip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
sysinfo = "0.39"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
